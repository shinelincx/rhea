name: rhea-local

services:
  database:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: rhea
      POSTGRES_PASSWORD: rhea_dev_password
      POSTGRES_USER: rhea
    ports:
      - '5432:5432'
    volumes:
      - rhea-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rhea -d rhea']
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.2.1-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - rhea-redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 20

  object-storage:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: rhea
      MINIO_ROOT_PASSWORD: rhea_dev_password
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - rhea-objects:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 2s
      timeout: 3s
      retries: 30

  object-storage-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z-cpuv1
    depends_on:
      object-storage:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://object-storage:9000 rhea rhea_dev_password &&
        mc mb --ignore-existing local/rhea-private

volumes:
  rhea-objects:
  rhea-postgres:
  rhea-redis:
